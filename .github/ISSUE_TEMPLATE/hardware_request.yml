name: Hardware request
description: Ask for wifit3 to support a new USB Wi-Fi adapter.
title: "[Hardware]: "
labels: ["hardware-request"]
body:
  - type: markdown
    attributes:
      value: |
        Request wifit3 to support a new wireless USB adapter.

        Adding a chipset is contributor-driven: I can't port devices I don't have.
        If you have the adapter and want to help, you can port it yourself using a coding agent and
        https://github.com/derv82/wifit3/blob/master/docs/porting/METHODOLOGY.md
        
        Even if you can't capture/port the driver, please still file the request
        so I know there is demand for the device.
  - type: input
    id: adapter
    attributes:
      label: Adapter (make and model)
      description: The retail name, exactly as it's sold.
      placeholder: "Alfa AWUS036AXM, TP-Link Archer T3U, Panda PAU0F, etc."
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Store / product link
      description: An Amazon or vendor URL, to identify the exact chipset and hardware revision.
      placeholder: "https://..."
  - type: dropdown
    id: have-it
    attributes:
      label: Do you have this adapter?
      description: Whoever holds the hardware is the only one who can capture and test it, so this matters.
      options:
        - "Yes, and I can help capture / test it"
        - "Yes, but I'd rather not get involved in porting"
        - "No, I'm requesting it or thinking of buying it"
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This adapter is known to support monitor mode + injection on Linux.
          required: true
