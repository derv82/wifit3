# Dependabot: security updates stay ON (they're driven by alerts, not this file). Scheduled
# *version* updates are disabled via open-pull-requests-limit: 0 (that limit doesn't apply to
# security PRs). Bump by hand when wanted (uv lock --upgrade); set the limits back to 5 to re-enable.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
