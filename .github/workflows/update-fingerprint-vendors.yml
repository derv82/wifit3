# Keeps src/wifit3/wlan/fingerprint_vendors.py from going stale without a person remembering to
# re-run the generator. Wireshark refreshes its own manuf feed weekly (see the generator's
# module docstring), so this runs a day after that on the same cadence.
#
# Lint + the full suite run here, before a PR is opened: a PR opened by the default GITHUB_TOKEN
# does not trigger other workflows (ci.yml would never see it), so this is the only check that
# refreshed data doesn't break anything, and a failure here means no PR gets opened at all.
#
# If nothing in the feed changed since last time, create-pull-request finds no diff and no-ops
# (no empty PR spam).

name: Update fingerprint vendor table

on:
  schedule:
    - cron: "0 6 * * 2"  # Tuesday 06:00 UTC -- a day after Wireshark's own weekly refresh
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync env (runtime + dev deps)
        run: uv sync --group dev

      - name: Refresh the generated vendor table
        run: uv run python scripts/generators/gen_fingerprint_vendors.py

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Unit tests
        run: uv run pytest

      - name: Open a PR if the table changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(wlan): refresh generated vendor table"
          title: "chore(wlan): refresh generated vendor table"
          body: >
            Automated weekly refresh of `fingerprint_vendors.py` from
            [Wireshark's manuf feed](https://www.wireshark.org/download/automated/data/manuf).
            Lint and the full test suite already passed in this run. The diff is data-only
            (new/changed OUI-to-vendor entries) -- worth a skim for anything that looks like a
            cleanup regression before merging, but nothing here changes app behavior.
          branch: auto/refresh-fingerprint-vendors
          delete-branch: true
          add-paths: src/wifit3/wlan/fingerprint_vendors.py
          labels: automated
